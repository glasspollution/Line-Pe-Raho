name: ci

# L0 gate on every PR and on main. No secrets are available here: the default test run spends zero credits
# (conftest.py blocks the network), so CI never needs the Gnani key.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5

      - name: Install backend deps
        run: uv pip install --system -r pyproject.toml --extra dev

      - uses: actions/setup-node@v4
        if: hashFiles('frontend/package.json') != ''
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps and browsers
        if: hashFiles('frontend/package.json') != ''
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Base ratchet (ids may only grow)
        run: |
          git show "origin/${{ github.base_ref || 'main' }}:eval/ratchet.json" > "$RUNNER_TEMP/base_ratchet.json" 2>/dev/null \
            || echo '{"tests": []}' > "$RUNNER_TEMP/base_ratchet.json"

      - name: Gate
        run: python scripts/check.py --base-ratchet "$RUNNER_TEMP/base_ratchet.json"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: reports/
          if-no-files-found: ignore
