normalize:
  - ["Press ONE, for Recharge!", "press 1 for recharge"]
  - ["do dabaiye", "2 dabaiye"]
  - ["press star", "press *"]
  - ["press hash", "press #"]
  - ["press pound", "press #"]
  - ["chaar dabaiye", "4 dabaiye"]
  - ["char dabaiye", "4 dabaiye"]
  - ["shunya dabaiye", "0 dabaiye"]
  - ["press zero", "press 0"]
