  - id: hi_12_voice_batayein
    text: "beep ke baad apni query batayein"
    voice_prompt: true
  - id: hi_13_announcement
    text: "aapki call humare liye mahatvapurn hai kripya line par bane rahein"
  - id: hi_14_busy
    text: "sabhi pratinidhi abhi vyast hain kripya pratiksha karein"
  - id: hi_15_dabayen
    text: "pratinidhi se baat karne ke liye nau dabayen"
    options: {"9": [pratinidhi]}
  - id: hi_16_press_karein
    text: "complaint darj karne ke liye paanch press karein"
    options: {"5": [complaint]}
  - id: hi_17_two_in_one
    text: "refund ke liye chhe dabaiye aur recharge ke liye saat dabaiye"
    options: {"6": [refund], "7": [recharge]}
  - id: hi_18_digit_first_ke_liye
    text: "aath dabaiye mukhya menu par jaane ke liye"
    options: {"8": [mukhya menu]}
  - id: hi_19_star_first
    text: "star dabaiye pichhle menu ke liye"
    options: {"*": [pichhle]}
  - id: hi_20_trailing_without_verb
    text: "english ke liye ek dabaiye hindi ke liye do"
    options: {"1": [english]}
    exact: false
  - id: hi_21_bank
    text: "Sahyog Bank mein aapka swagat hai. Credit card ke liye 1 dabaiye, savings account ke liye 2 dabaiye, loan ke liye 3 dabaiye."
    options: {"1": [credit card], "2": [savings], "3": [loan]}
  - id: hi_22_bijli_partial
    text: "Prakash Bijli Board. Bijli kati hai to 1 dabaiye. Bill ke liye 2."
    options: {"1": [bijli]}
    exact: false
  - id: hi_23_zero_word
    text: "agent se baat karne ke liye zero dabaiye"
    options: {"0": [agent]}
  - id: hi_24_press_ek
    text: "press ek for recharge"
    options: {"1": [recharge]}
  - id: hi_25_for_hindi
    text: "for hindi press two"
    options: {"2": [hindi]}

  # ---------------- Devanagari (hi-IN sessions) — digits only ----------------
  - id: dev_01
    text: "रिचार्ज के लिए एक दबाइए। डेटा के लिए दो दबाइए।"
    options: {"1": [], "2": []}
  - id: dev_02
    text: "अंग्रेज़ी के लिए 1 दबाएं, हिंदी के लिए 2 दबाएं"
    options: {"1": [], "2": []}
  - id: dev_03
    text: "ग्राहक सेवा अधिकारी से बात करने के लिए शून्य दबाइए"
